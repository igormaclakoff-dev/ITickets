# Шаблоны быстрых ответов для персонала.
# Персонал открывает тикет -> кнопка «Шаблоны» -> выбирает заготовку.
# text попадает в комментарий тикета (отправляется сразу как ответ).
#
# Поддерживаемые плейсхолдеры в text/name/lore:
#   %admin%          - ник сотрудника, который применяет шаблон
#   %player%         - ник автора тикета
#   %id%             - номер тикета
#   %category%       - категория тикета
#   %priority_name%  - важность словами
#   %status%         - статус тикета
#   %assigned%       - ответственный
#   %created%        - дата создания
#   %updated%        - дата обновления
#
# group - необязательная группа вкладки (для сортировки/подписи).
# admin-only - true, чтобы шаблон видели только админы (itickets.manage).

templates:
  greeting:
    name: "Приветствие"
    material: "PAPER"
    group: "Общие"
    slot: 10
    text: "Здравствуйте, %player%! Спасибо за обращение, уже разбираемся с вашим вопросом."
  greeting_admin:
    name: "Приветствие от %admin%"
    material: "PAPER"
    group: "Общие"
    slot: 11
    text: "Здравствуйте! Меня зовут %admin%, я занимаюсь вашим обращением #%id%. Готов помочь."
  need_info:
    name: "Нужны детали"
    material: "BOOK"
    group: "Общие"
    slot: 12
    text: "Уточните, пожалуйста, подробности: время, место и что именно произошло. Так я смогу разобраться быстрее."
  checking:
    name: "Проверяем"
    material: "COMPASS"
    group: "Общие"
    slot: 13
    text: "Принял обращение в работу, проверяю информацию. Ответ дам в ближайшее время."
  wait:
    name: "Ожидание"
    material: "CLOCK"
    group: "Общие"
    slot: 14
    text: "Ваш вопрос передан профильному специалисту, пожалуйста, ожидайте ответа."
  escalated:
    name: "Передано старшему"
    material: "BELL"
    group: "Общие"
    slot: 15
    text: "Передал обращение старшему составу администрации. Ответ появится в этом тикете."
  resolved:
    name: "Решено"
    material: "LIME_DYE"
    group: "Закрытие"
    slot: 19
    text: "Проблема решена. Если что-то осталось — напишите в этот же тикет, мы продолжим."
  resolved_short:
    name: "Решено (кратко)"
    material: "LIME_DYE"
    group: "Закрытие"
    slot: 20
    text: "Вопрос решен, приятной игры!"
  closed_by_admin:
    name: "Закрыто администратором"
    material: "GRAY_DYE"
    group: "Закрытие"
    slot: 21
    text: "Закрываю тикет #%id%. Действие выполнено администратором %admin%."
  denied:
    name: "Отказ"
    material: "RED_DYE"
    group: "Закрытие"
    slot: 22
    text: "К сожалению, обращение отклонено: недостаточно оснований. При появлении доказательств создайте новый тикет."
  duplicate:
    name: "Дубликат"
    material: "PAPER"
    group: "Закрытие"
    slot: 23
    text: "Такое обращение уже зарегистрировано. Отвечу в основном тикете, этот закрываю как дубликат."
  no_proof:
    name: "Нет доказательств"
    material: "SPECTRAL_ARROW"
    group: "Закрытие"
    slot: 24
    text: "Нарушение не подтверждено: не хватает доказательств (скриншот/видео). Обращение отклонено."
  out_of_scope:
    name: "Вне зоны поддержки"
    material: "COMPASS"
    group: "Закрытие"
    slot: 25
    text: "Этот вопрос не относится к зоне поддержки сервера. Рекомендую обратиться напрямую к разработчику." 
  rules:
    name: "Напоминание о правилах"
    material: "BOOK"
    group: "Нарушения"
    slot: 28
    text: "Напоминаю о правилах сервера: нарушение влечет наказание. Ознакомиться можно в /rules."
  punishment:
    name: "Наказание выдано"
    material: "IRON_SWORD"
    group: "Нарушения"
    slot: 29
    text: "Нарушитель получил наказание согласно правилам сервера. Спасибо за бдительность!"
  muted:
    name: "Выдан мут"
    material: "SCAFFOLDING"
    group: "Нарушения"
    slot: 30
    text: "Игроку выдан мут за нарушение правил общения. Спасибо за сообщение."
  banned:
    name: "Выдан бан"
    material: "IRON_BARS"
    group: "Нарушения"
    slot: 31
    text: "Нарушитель забанен. Обращение обработано администратором %admin%."
  cheater:
    name: "Читер забанен"
    material: "NETHERITE_SWORD"
    group: "Нарушения"
    slot: 32
    text: "Использование запрещенных модификаций подтверждено. Игрок забанен."
  unban_info:
    name: "О разбане"
    material: "GOLDEN_APPLE"
    group: "Нарушения"
    slot: 33
    text: "Снять наказание можно только через заявку на форуме/в официальном Discord сервера."
  compensation:
    name: "Компенсация"
    material: "EMERALD"
    group: "Помощь"
    slot: 34
    text: "Компенсация за потерю выдана. Проверьте инвентарь."
  item_lost:
    name: "Потеря предметов"
    material: "SHULKER_BOX"
    group: "Помощь"
    slot: 37
    text: "Опишите потерянные предметы и обстоятельства (время, место, что делали). По логам попробуем восстановить."
  rollback:
    name: "Откат"
    material: "CLOCK"
    group: "Помощь"
    slot: 38
    text: "Откат территории выполнен. Если что-то еще не восстановилось — напишите сюда."
  region_help:
    name: "По региону"
    material: "STONE_BRICK_WALL"
    group: "Помощь"
    slot: 39
    text: "Уточните название региона и точки привата. Проверю права и настройки региона."
  tp_request:
    name: "Запрос телепорта"
    material: "ENDER_PEARL"
    group: "Помощь"
    slot: 40
    text: "Телепортация к месту тикета выполнена. Если не сработало — выйдите и зайдите заново."
  bug_reported:
    name: "Баг принят"
    material: "REDSTONE"
    group: "Техническое"
    slot: 41
    text: "Баг зафиксирован и передан разработчикам. Спасибо за подробное описание!"
  need_video:
    name: "Просим видео"
    material: "OAK_BOAT"
    group: "Техническое"
    slot: 42
    text: "Пришлите, пожалуйста, видео воспроизведения проблемы — так баг будет исправлен быстрее."
  lag_report:
    name: "Лаги/производительность"
    material: "REDSTONE_TORCH"
    group: "Техническое"
    slot: 43
    text: "Проверил нагрузку на сервере, критичных проблем не обнаружено. Если лаги повторятся — сообщите время и место."
  thanks:
    name: "Благодарность"
    material: "SUNFLOWER"
    group: "Общие"
    slot: 16
    text: "Спасибо за обратную связь и помощь серверу!"
  goodbye:
    name: "Прощание"
    material: "BELL"
    group: "Общие"
    slot: 17
    text: "Рад был помочь! Если появятся вопросы — создавайте новый тикет. Хорошей игры!"
